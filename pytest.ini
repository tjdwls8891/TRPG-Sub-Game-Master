[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    characterize: 현재 동작을 고정하는 특성화 테스트. 의도적 변경 시 함께 바뀐다.
    defect: 알려진 결함 재현. 바람직한 단언은 strict xfail로 표시한다.
    policy: 목표 정책 테스트. 해당 WP가 프리미티브를 만들기 전까지 skip될 수 있다.
filterwarnings =
    ignore::DeprecationWarning:audioop
